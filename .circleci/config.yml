version: 2.1
jobs:
  build:
    docker:
      - image: 218546966473.dkr.ecr.us-east-1.amazonaws.com/circle-ci:stitch-tap-tester-uv
    steps:
      - checkout
      - run:
          name: 'Setup virtual env'
          command: |
            uv venv --python 3.9 /usr/local/share/virtualenvs/tap-oracle
            source /usr/local/share/virtualenvs/tap-oracle/bin/activate
            uv pip install -U pip setuptools
            uv pip install .[dev]
      - run:
         name: 'pylint'
         command: |
            source /usr/local/share/virtualenvs/tap-oracle/bin/activate
            # TODO: Adjust the pylint disables
            pylint tap_oracle -d C,R,W,assignment-from-no-return,c-extension-no-member
      - store_test_results:
          path: test_output/report.xml
      - store_artifacts:
          path: htmlcov

workflows:
  version: 2
  commit:
    jobs:
      - build:
          context: circleci-user
  build_daily:
    triggers:
      - schedule:
          cron: "0 12 * * *"
          filters:
            branches:
              only:
                - master
    jobs:
      - build:
          context: circleci-user
